# Serves the IBSng PHP admin panel at http://<host>/IBSng/admin

ServerName 127.0.0.1

Alias /IBSng /usr/local/IBSng/interface/IBSng

<Directory /usr/local/IBSng/interface/IBSng>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
