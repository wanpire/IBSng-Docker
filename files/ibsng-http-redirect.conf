# Plain-HTTP vhost used once a TLS cert exists — redirects everything to
# HTTPS except the ACME HTTP-01 challenge path, so certbot renewals (which
# always run over plain HTTP, even after HTTPS is otherwise mandatory)
# keep working forever, not just during initial cert issuance. Enabled by
# entrypoint.sh in place of the stock 000-default site once a cert is
# found; see files/ibsng-ssl.conf.template for the matching :443 vhost.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
